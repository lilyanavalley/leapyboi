[toolchain]
# The `esp` channel bundles the Espressif Rust fork for Xtensa targets and the
# official RISC-V targets (ESP32-C3, ESP32-C6, ESP32-H2).  It is published via
# the esp-rs/rust-build releases and managed by `espup`.
# Run `cargo install espup && espup install` to set it up on a new machine.
channel = "esp"
