[package]
name        = "leapyboi"
version     = "0.3.0"
edition     = "2021"
description = "ESP32-C6 firmware: WS2812B Neopixel ring light controlled over MQTT / HomeAssistant"
resolver    = "2"

# ── Feature flags ──────────────────────────────────────────────────────────────
[features]
# Default features for embedded target (includes ESP32 support)
default = ["esp32"]
# Enable ESP32-specific drivers and services (required for the binary).
# Disabled by default for library tests on the host.
esp32 = ["esp-idf-svc", "ws2812-esp32-rmt-driver", "embedded-svc"]
# Enable support for the Seeed XIAO 24 GHz mmWave Human Static Presence Sensor.
# Build with: cargo build --features mmwave
mmwave = []
# Optional high-verbosity mmWave UART diagnostics for troubleshooting.
# Build with: cargo build --features "mmwave,mmwave-diagnostics"
mmwave-diagnostics = ["mmwave"]

[lib]
name = "leapyboi"

[[bin]]
name    = "leapyboi"
path    = "src/main.rs"
harness = false

# ── Release profile ──────────────────────────────────────────────────────────
[profile.release]
opt-level = "z"   # Optimise for size

[profile.dev]
debug     = true
opt-level = "z"   # Also optimise for size in dev (flash space is limited)

# ── Runtime dependencies ──────────────────────────────────────────────────────
[dependencies]
# ESP-IDF high-level services: WiFi, MQTT, NVS, event-loop, …
# `binstart` pulls in the esp-idf-sys start-up glue that calls main().
# Only needed for the embedded binary, not for library tests.
esp-idf-svc = { version = "0.51", features = ["binstart"], optional = true }

# WS2812B / Neopixel driver over the RMT peripheral.
# `smart-leds-trait` enables the SmartLedsWrite impl used in led.rs.
# Only needed for the embedded binary, not for library tests.
ws2812-esp32-rmt-driver = { version = "0.13", features = ["smart-leds-trait"], optional = true }

# Colour iterator helpers (RGB8 type, brightness scaling).
smart-leds = "0.4"

# Logging façade — backed by ESP-IDF's logging facility at runtime.
log = { version = "0.4", default-features = false }

# Embedded service traits (HTTP client, IO) — used by the OTA module.
embedded-svc = { version = "0.28", default-features = false, optional = true }

# Ergonomic error handling with backtraces (std is available via ESP-IDF).
anyhow = "1"

# JSON serialisation for MQTT payloads and HA discovery messages.
serde      = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"

# ── Build-time dependencies ───────────────────────────────────────────────────
[build-dependencies]
# embuild handles the ESP-IDF CMake build and exposes linker search paths.
embuild = { version = "=0.31.4", features = ["espidf"] }
# Used in build.rs to parse cfg.toml.
toml  = "0.8"
serde = { version = "1", features = ["derive"] }
# Used in build.rs to decode animation.png into a firmware-baked const array.
png = "0.17"
